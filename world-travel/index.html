<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Shiori's World Travel</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FF7A59" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="World Travel" />
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<link rel="icon" href="assets/icons/icon-192.png" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="onboard-root" hidden></div>

<div id="app" hidden>
  <button id="settings-btn" class="settings-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"></circle>
      <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.6a7.6 7.6 0 0 0-1.8-1l-.4-2.4h-4l-.4 2.4a7.6 7.6 0 0 0-1.8 1l-2.3-.6-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.6a7.6 7.6 0 0 0 1.8 1l.4 2.4h4l.4-2.4a7.6 7.6 0 0 0 1.8-1l2.3.6 2-3.4-2-1.5Z"></path>
    </svg>
  </button>

  <main id="view-root"></main>

  <button id="fab-add-travel" class="fab-add-travel" type="button">+ Add Travel</button>

  <nav id="bottom-nav" class="bottom-nav">
    <button type="button" class="nav-btn" data-tab="map">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z"></path>
        <circle cx="12" cy="9.5" r="2.4"></circle>
      </svg>
      <span class="nav-label">Map</span>
    </button>
    <button type="button" class="nav-btn" data-tab="countries">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"></rect>
        <rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6"></rect>
        <rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"></rect>
        <rect x="13" y="13" width="7.5" height="7.5" rx="1.6"></rect>
      </svg>
      <span class="nav-label">Countries</span>
    </button>
    <button type="button" class="nav-btn" data-tab="discover">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"></circle>
        <path d="m15 9-2 5-5 2 2-5 5-2Z"></path>
      </svg>
      <span class="nav-label">Discover</span>
    </button>
  </nav>
</div>

<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
