<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Study Ocean - オフライン</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F6FBFA;
    color: #223733;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    text-align: center;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #10211F; color: #E7F3F0; }
  }
  .card { max-width: 320px; }
  svg { width: 72px; height: 72px; margin-bottom: 18px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.7; color: #5F7B76; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="24" fill="#DCEBE8"/>
      <path d="M18 64c6-8 12-8 18 0s12 8 18 0 12-8 18 0 12 8 18 0" stroke="#8FB7AD" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>今は海とつながっていません</h1>
    <p>通信環境が回復すると、いつもの海に戻れます。<br />ネットワークを確認して、もう一度開いてください。</p>
  </div>
</body>
</html>
